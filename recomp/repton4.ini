; libroger's settings for repton4 (beside it, as <program>.ini)

[crop]
; --crop: the rows of the 256-line screen to show (FIRST-LAST, or all),
; to start with and from when the code at an address first runs (in hex)

; !RunImage's title picture (LoadScreen) fills the screen
rows = all
; ObjCode, once its start-up (&8474: the Resources files and !Help) has
; returned to the main loop at &8258: the title, the menus, the high
; scores and the game all use rows 28-227
8258 = 28-227
